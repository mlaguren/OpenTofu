name: Terratest (IAM Developer Role)

on:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write      # OIDC!
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  terratest-iam:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.7.3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # Terraform variable injection for module:
      # Allow the CI role itself to AssumeRole into the just-created dev-role (test does sts:AssumeRole)
      - name: Set TF_VARs for module
        run: |
          echo 'TF_VAR_additional_trusted_principals=["${{ secrets.AWS_CI_ROLE_TO_ASSUME }}"]' >> $GITHUB_ENV
          # Optional: if your envs/dev expects a region var
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Run Terratest (IAM Developer Role)
        working-directory: tests
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          # Provide AWS account id for the test (used to build OIDC provider ARN)
          AWS_ACCOUNT_ID: ${{ steps.sts_id.outputs.account }}
          # Ensure tofu is what Terratest uses
          TERRATEST_LOG_PARSER: json
        run: |
          # Resolve account id for the test var
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV

          # run test and emit junit
          gotestsum --junitfile test-report.xml -- \
            -run TestIamDeveloperRole -v -timeout 30m | tee output.txt

      - name: Upload test report (JUnit)
        uses: actions/upload-artifact@v4
        with:
          name: junit-terratest
          path: tests/test-report.xml
          if-no-files-found: warn

      - name: Upload raw test output
        uses: actions/upload-artifact@v4
        with:
          name: terratest-output
          path: tests/output.txt
          if-no-files-found: warn
