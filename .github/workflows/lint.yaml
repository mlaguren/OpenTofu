name: Lint (OpenTofu)

on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  lint-tofu:
    name: Lint OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.7.3

      - name: Check formatting
        run: |
          tofu fmt -check -recursive .

      - name: Validate each env
        run: |
          set -euo pipefail
          find envs -maxdepth 2 -name main.tf -print0 | while IFS= read -r -d '' f; do
            d="$(dirname "$f")"
            echo "::group::validate $d"
            (cd "$d" && tofu init -backend=false -upgrade && tofu validate)
            echo "::endgroup::"
          done

      - name: Install TFLint
        run: |
          curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init

      - name: Run TFLint (recursive)
        run: tflint --recursive

      - name: tfsec (security scan)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          additional_args: --concise-output --minimum-severity MEDIUM
